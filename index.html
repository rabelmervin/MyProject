      /* Newsletter subscribe input — hand-written because the prebuilt
         Tailwind CSS is purged, so new utility classes do not exist. */
      .tier3-input{flex:1 1 0%;height:3.25rem;padding:0 1.25rem;border-radius:9999px;
        background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);

      .tier3-btn{display:inline-flex;align-items:center;justify-content:center;
        height:3.25rem;padding:0 2.25rem;border:0;border-radius:9999px;
        background:linear-gradient(180deg,rgba(2,91,207,1) 0%,rgba(0,145,189,1) 100%);

      .tier3-btn:hover{opacity:.92;box-shadow:0 6px 24px rgba(0,145,189,.5)}
      .tier3-btn:active{transform:scale(.97)}
      /* Hero: photo left, caption right on lg+. Below lg it stacks:
         photo, then caption, then buttons. The grid rules are written
         .x.x to out-specify Tailwind's .flex, which loads after this block. */
      .tier3-photo{position:relative;flex:none;
        width:min(72vw,300px);height:min(72vw,300px);
        border-radius:1.5rem;border:2px solid rgba(255,255,255,.12);

      /* One continuous background shared by the closing CTA + footer,

         [background:radial-gradient(...)] utilities on those sections. */
      .tier3-closing-bg{background:linear-gradient(180deg,rgb(2,8,22) 0%,rgb(2,22,45) 16%,rgb(2,38,70) 32%,rgb(2,50,88) 46%,rgb(2,52,92) 54%,rgb(2,38,70) 68%,rgb(2,22,45) 84%,rgb(2,8,22) 100%)}

    <!-- Chrome/Browser Zoom Detection & Fix -->
    <script>
      // Detect and fix browser zoom issues
      function detectAndFixZoom() {
        const actualWidth = window.innerWidth;
        const expectedWidth = screen.width;
        const zoomLevel = Math.round((actualWidth / expectedWidth) * 100);
        
        // Force proper scaling if zoom is detected
        if (zoomLevel < 90 || zoomLevel > 110) {
          document.body.style.zoom = "100%";
          document.body.style.transform = "scale(1)";
        }
      }
      
      // Chrome-specific fixes
      if (navigator.userAgent.includes("Chrome")) {
        window.addEventListener('load', function() {
          // Force layout recalculation
          setTimeout(() => {
            document.body.style.display = 'none';
            document.body.offsetHeight; // Trigger reflow
            document.body.style.display = '';
            detectAndFixZoom();
          }, 50);
        });
      }
      
      // Reset on resize
      window.addEventListener('resize', detectAndFixZoom);
    </script>
